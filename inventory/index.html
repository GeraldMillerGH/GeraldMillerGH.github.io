<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory</title><link rel="stylesheet" href="../style.css">
<style>
:root{--s-ok:#2e8b57;--s-low:#c98a00;--s-add:#c0392b}
@media (prefers-color-scheme:dark){:root{--s-ok:#6fcf97;--s-low:#f2c94c;--s-add:#ff7b6b}}
.summary{font-size:1.05rem;font-weight:600;margin:.4em 0 0}
h2 .count{color:var(--muted);font-weight:400;font-size:1rem}
.hint{color:var(--muted);font-size:.8rem;margin:.2em 0 .4em}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:.5em 0 .3em}
.tools button{font:inherit;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.tools button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
ul.inv{list-style:none;padding:0;margin:0}
ul.inv li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 6px 4px 10px;line-height:1.25;font-size:.95rem;border-bottom:1px solid var(--line);box-shadow:inset 4px 0 0 var(--sc,transparent)}
ul.inv li.low{--sc:var(--s-low);background:color-mix(in srgb,var(--s-low) 8%,transparent)}
ul.inv li.add{--sc:var(--s-add);background:color-mix(in srgb,var(--s-add) 8%,transparent)}
ul.inv li.add .name{font-weight:700}
.name{flex:1;min-width:0}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-size:.78rem;font-weight:600;padding:5px 10px;line-height:1.2;border:0;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on[data-s="ok"]{background:var(--s-ok);color:var(--bg)}
.seg button.on[data-s="low"]{background:var(--s-low);color:#222}
.seg button.on[data-s="add"]{background:var(--s-add);color:var(--bg)}
@media (max-width:480px){.seg button{padding:5px 8px;font-size:.74rem}ul.inv li{font-size:.9rem}}
main h2{margin:1.1em 0 .3em}
.empty{color:var(--muted)}
form.extra{display:flex;gap:8px;margin:.6em 0 .2em}
form.extra input{flex:1;min-width:0;font:inherit;font-size:.95rem;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
form.extra input:focus{outline:2px solid var(--accent);outline-offset:1px}
form.extra button{font:inherit;font-size:.85rem;font-weight:600;padding:6px 14px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
ul.extras{list-style:none;padding:0;margin:0 0 .3em}
ul.extras li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 6px 4px 10px;line-height:1.25;font-size:.95rem;font-weight:700;border-bottom:1px solid var(--line);box-shadow:inset 4px 0 0 var(--s-add);background:color-mix(in srgb,var(--s-add) 8%,transparent)}
ul.extras button{font:inherit;font-size:1.1rem;line-height:1;padding:2px 10px;border:0;background:none;color:var(--muted);cursor:pointer}
.also{display:block;color:var(--muted);font-size:.7rem;font-weight:400;line-height:1.15}
</style></head>
<body><header class="site"><a href="../index.html">Home</a><a href="../recipes/index.html">Recipes</a><a href="../habits/index.html">Habits</a><a href="../projects/index.html">Projects</a></header>
<main>
<h1>Household Inventory</h1>
<p class="summary" id="summary"></p>
<div class="tools"><button class="primary" id="share">Copy list</button><button id="reset" hidden>Mark all in stock</button></div>
<form class="extra" id="extraForm" autocomplete="off"><input id="extraIn" placeholder="Add something else to the list…" enterkeyhint="done"><button type="submit">Add</button></form>
<ul class="extras" id="extras"></ul>
<p class="hint">Walk the house and set each item. “Add” and “Low” items are copied as one list, one item per line, ready to paste into Notes.</p>
<div id="out"><p class="empty">Loading…</p></div>
</main>
<script>
(function(){
  var KEY='invState', ST={}; try{ST=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
  var EX=[]; try{EX=JSON.parse(localStorage.getItem('invExtras')||'[]');}catch(e){}
  function saveEx(){try{localStorage.setItem('invExtras',JSON.stringify(EX));}catch(e){}}
  function renderEx(){
    document.getElementById('extras').innerHTML=EX.map(function(x,i){return '<li><span>'+esc(x)+'</span><button data-x="'+i+'" aria-label="Remove">\u00d7</button></li>';}).join('');
    counts();
  }
  document.getElementById('extraForm').addEventListener('submit',function(e){
    e.preventDefault(); var inp=document.getElementById('extraIn'), v=inp.value.trim();
    if(v){EX.push(v);saveEx();renderEx();} inp.value='';
  });
  document.getElementById('extras').addEventListener('click',function(e){
    var b=e.target.closest('button[data-x]'); if(!b)return; EX.splice(+b.getAttribute('data-x'),1); saveEx(); renderEx();
  });
  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
  var ROOMS=[], LABELS={ok:'In stock',low:'Low',add:'Add'};
  function id(room,item){return item;}
  var WHERE={};
  function get(k){return ST[k]||'ok';}
  function render(){
    document.getElementById('out').innerHTML=ROOMS.map(function(r){
      return '<h2>'+esc(r.name)+' <span class="count" data-room="'+esc(r.name)+'"></span></h2><ul class="inv">'+r.items.map(function(it){
        var k=id(r.name,it), s=get(k), also=WHERE[it].filter(function(x){return x!==r.name;});
        return '<li class="'+s+'" data-k="'+esc(k)+'"><span class="name">'+esc(it)+(also.length?'<small class="also">also in '+esc(also.join(', '))+'</small>':'')+'</span><span class="seg">'+['ok','low','add'].map(function(x){
          return '<button data-s="'+x+'"'+(x===s?' class="on"':'')+' aria-pressed="'+(x===s)+'">'+LABELS[x]+'</button>';}).join('')+'</span></li>';
      }).join('')+'</ul>';
    }).join('');
    counts();
  }
  function picked(s){var out=[];Object.keys(WHERE).forEach(function(it){if(get(it)===s)out.push({rooms:WHERE[it],item:it});});return out;}
  function counts(){
    var a=picked('add').length+EX.length,l=picked('low').length;
    document.getElementById('summary').textContent=a||l?(a?a+' to add':'')+(a&&l?' · ':'')+(l?l+' running low':''):'Everything in stock.';
    document.getElementById('reset').hidden=!(a||l);
    document.querySelectorAll('.count').forEach(function(c){
      var r=c.getAttribute('data-room'),n=picked('add').filter(function(x){return x.rooms.indexOf(r)>=0;}).length;c.textContent=n?'('+n+' to add)':'';});
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('.seg button'); if(!b)return;
    var li=b.closest('li'),k=li.getAttribute('data-k'),s=b.getAttribute('data-s');
    if(s==='ok')delete ST[k]; else ST[k]=s; save();
    document.querySelectorAll('ul.inv li').forEach(function(l){if(l.getAttribute('data-k')!==k)return;l.className=s;l.querySelectorAll('button').forEach(function(x){var on=x.getAttribute('data-s')===s;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});});
    counts();
  });
  function listText(){
    var seen={},out=[];
    picked('add').map(function(x){return x.item;}).concat(EX,picked('low').map(function(x){return x.item;})).forEach(function(x){if(!seen[x]){seen[x]=1;out.push(x);}});
    return out.join('\n');
  }
  function flash(b,msg){var t=b.textContent;b.textContent=msg;setTimeout(function(){b.textContent=t;},1800);}
  function copy(txt){
    if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(txt);
    var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();return Promise.resolve();
  }
  document.getElementById('share').addEventListener('click',function(){
    var b=this,txt=listText();
    if(!txt){flash(b,'Nothing to copy');return;}
    copy(txt).then(function(){flash(b,'Copied \u2014 paste in Notes');},function(){
      if(navigator.share)navigator.share({text:txt}).catch(function(){});else flash(b,'Couldn\u2019t copy');});
  });
  document.getElementById('reset').addEventListener('click',function(){
    if(!confirm('Mark everything back to in stock and clear extra items?'))return;
    ST={};save();EX=[];saveEx();render();renderEx();
  });
  fetch('inventory.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    ROOMS=d.rooms||[];
    ROOMS.forEach(function(r){r.items.forEach(function(it){(WHERE[it]=WHERE[it]||[]).push(r.name);});});
    for(var k in ST){var n=k.indexOf('|')>=0?k.split('|').pop():k;if(n!==k){if(!ST[n]||ST[k]==='add')ST[n]=ST[k];delete ST[k];}}
    for(var k in ST){if(!WHERE[k])delete ST[k];} save();
    render();renderEx();
  }).catch(function(){document.getElementById('out').innerHTML='<p class="empty">Couldn’t load the list.</p>';});
})();
</script>
</body></html>
