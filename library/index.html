<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library</title><link rel="stylesheet" href="../style.css">
<style>
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.top h1{margin-top:.4em}
.side{text-align:right;font-size:.85rem;flex:none}
.side a{font-weight:600}
table.hours{border-collapse:collapse;margin:6px 0 0 auto}
table.hours td{padding:1px 0 1px 10px;text-align:left;color:var(--muted)}
table.hours td:first-child{padding-left:0}
table.hours tr.today td{color:var(--fg);font-weight:700}
table.hours tr.today td:first-child::before{content:"\25B8 ";color:var(--accent)}
.summary{font-size:1.05rem;font-weight:600;margin:.4em 0 0}
h2 .count{color:var(--muted);font-weight:400;font-size:1rem}
table.books{width:100%;border-collapse:collapse;font-size:1rem}
@media (max-width:480px){table.books{font-size:.92rem}table.books td{padding:7px 4px}}
table.books th{text-align:left;font-size:.8rem;font-weight:600;color:var(--muted);padding:6px;border-bottom:2px solid var(--line)}
table.books td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.books th:first-child{padding-left:10px}
table.books tr.p td.chk+td{padding-left:4px}
table.books th:last-child,table.books td:last-child{padding-right:8px}
table.books td.due,table.books td.kind,table.books td.who{white-space:nowrap;width:1%}
table.books td.due,table.books td.kind{color:var(--muted)}
table.books td.due.late{color:#c0392b;font-weight:700}
table.books tr.newdate td{border-top:2px solid var(--line)}
:root{--p-gerald:#2f6db5;--p-alice:#8a4fbf;--p-june:#2e8b57;--p-other:#777}
@media (prefers-color-scheme:dark){:root{--p-gerald:#6fa8ef;--p-alice:#c49cf0;--p-june:#6fcf97}}
table.books tr.p td:first-child{box-shadow:inset 4px 0 0 var(--pc);padding-left:10px}
table.books tr.p td{background:color-mix(in srgb,var(--pc) 7%,transparent)}
table.books td.who b{color:var(--pc);font-weight:700}
table.books tr.p{cursor:pointer}
table.books tr.p:hover td{background:color-mix(in srgb,var(--pc) 14%,transparent)}
table.books tr.pic td{background:color-mix(in srgb,var(--pc) 7%,transparent);box-shadow:inset 4px 0 0 var(--pc);padding:6px 10px 14px;text-align:center}
table.books tr.pic img{max-width:100%;max-height:260px;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.25);display:block;margin:4px auto 6px}
table.books tr.pic .msg{color:var(--muted);font-size:.85rem;margin:6px 0}
table.books tr.pic a{font-size:.85rem}
.hint{color:var(--muted);font-size:.8rem;margin:.2em 0 .4em}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:.5em 0 .3em}
.tools button{font:inherit;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.tools button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
table.books td.chk{width:1%;padding-right:2px}
table.books td.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--pc);cursor:pointer}
table.books tr.found td:not(.chk){opacity:.45}
table.books tr.found td:nth-child(3){text-decoration:line-through}
.empty{color:var(--muted)}
details table.books{margin-top:6px}
</style></head>
<body><header class="site"><a href="../index.html">Home</a><a href="../recipes/index.html">Recipes</a><a href="../habits/index.html">Habits</a><a href="../vbl/">VBL Scout</a></header>
<main>
<div class="top">
  <div><h1>Library</h1><p class="meta" id="updated"></p></div>
  <div class="side">
    <a href="https://sierramadre.biblionix.com/">Library account</a>
    <table class="hours" id="hours">
      <tr data-d="1"><td>Mon</td><td>11–8</td></tr>
      <tr data-d="2"><td>Tue</td><td>11–8</td></tr>
      <tr data-d="3"><td>Wed</td><td>11–8</td></tr>
      <tr data-d="4"><td>Thu</td><td>10–6</td></tr>
      <tr data-d="5"><td>Fri</td><td>Closed</td></tr>
      <tr data-d="6"><td>Sat</td><td>10–6</td></tr>
      <tr data-d="0"><td>Sun</td><td>Closed</td></tr>
    </table>
  </div>
</div>
<p class="summary" id="summary"></p>
<div class="tools"><button class="primary" id="share">Send list to Notes</button><button id="clear" hidden>Uncheck all</button></div>
<p class="hint">Tick items off as you find them. Tap a title to see the cover.</p>

<table class="books" id="out"><tr><td class="empty">Loading…</td></tr></table>

<details id="past-wrap" hidden><summary>Recently returned</summary><table class="books" id="past"></table></details>
</main>
<script>
(function(){
  var PEOPLE=['Gerald','Alice','June'];
  var dow=new Date().getDay();
  var tr=document.querySelector('#hours tr[data-d="'+dow+'"]'); if(tr)tr.className='today';
  function parse(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2]);}
  function fmt(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate();}
  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
  var ITEMS=[], CACHE={}, OPEN=[];
  var HEAD='<tr><th>Due</th><th>Title</th><th>Type</th><th>Who</th></tr>';
  var HEAD_OUT='<tr><th></th><th>Due</th><th>Title</th><th>Type</th><th>Who</th></tr>';
  var FOUND={}; try{FOUND=JSON.parse(localStorage.getItem('libFound')||'{}');}catch(e){}
  function saveFound(){try{localStorage.setItem('libFound',JSON.stringify(FOUND));}catch(e){}}
  function idOf(it){return it.barcode||(it.title+'|'+(it.who||''));}
  function row(it,past,brk){
    var date=past?(it.returned?fmt(it.returned):''):(it.due?fmt(it.due):'');
    var late=!past&&it.status==='Overdue';
    var pc='--pc:var(--p-'+(['Gerald','Alice','June'].indexOf(it.who)>=0?it.who.toLowerCase():'other')+')';
    ITEMS.push(it);
    var found=!past&&FOUND[idOf(it)];
    var chk=past?'':'<td class="chk"><input type="checkbox" aria-label="Found"'+(found?' checked':'')+'></td>';
    return '<tr class="p'+(brk?' newdate':'')+(found?' found':'')+'" data-i="'+(ITEMS.length-1)+'" style="'+pc+'">'+chk+'<td class="due'+(late?' late':'')+'">'+date+'</td><td>'+esc(it.title)+'</td><td class="kind">'+esc(it.kind||'Book')+'</td><td class="who"><b>'+esc(it.who||'')+'</b></td></tr>';
  }
  function clean(t){return (t||'').replace(/\s*\(.*?\)\s*/g,' ').trim();}
  function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json();});}
  function fromOpenLibrary(t){
    return getJSON('https://openlibrary.org/search.json?limit=5&fields=cover_i&title='+encodeURIComponent(t)).then(function(j){
      var d=(j.docs||[]).filter(function(x){return x.cover_i;})[0];
      return d?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':null;});
  }
  function findImage(it){
    var key=it.title+'|'+(it.who||'');
    if(CACHE[key])return CACHE[key];
    var p=it.img?Promise.resolve(it.img):((it.kind||'Book')==='Book'?fromOpenLibrary(clean(it.title)).catch(function(){return null;}):Promise.resolve(null));
    return CACHE[key]=p;
  }
  function toggle(tr){
    var next=tr.nextElementSibling;
    if(next&&next.classList.contains('pic')){next.remove();return;}
    var it=ITEMS[+tr.getAttribute('data-i')]; if(!it)return;
    var pic=document.createElement('tr'); pic.className='pic'; pic.setAttribute('style',tr.getAttribute('style'));
    var gl='https://www.google.com/search?tbm=isch&q='+encodeURIComponent(clean(it.title)+' '+((it.kind||'Book')==='Book'?'book cover':'game'));
    pic.innerHTML='<td colspan="'+tr.children.length+'"><p class="msg">Looking for a picture…</p></td>';
    tr.after(pic);
    var cat=it.link||(it.barcode?'https://sierramadre.biblionix.com/catalog/?search='+encodeURIComponent(it.barcode):'');
    var td=pic.firstChild, more=(cat?'<a href="'+cat+'" target="_blank" rel="noopener">In the library catalog</a> \u00b7 ':'')+'<a href="'+gl+'" target="_blank" rel="noopener">More pictures</a>';
    findImage(it).then(function(u){
      if(!u){td.innerHTML='<p class="msg">No picture found.</p>'+more;return;}
      var img=new Image(); img.alt=it.title;
      img.onload=function(){if(img.naturalWidth<10){img.onerror();return;}td.innerHTML='';td.appendChild(img);td.insertAdjacentHTML('beforeend',more);};
      img.onerror=function(){td.innerHTML='<p class="msg">No picture found.</p>'+more;};
      img.src=u;
    });
  }
  function updateClear(){document.getElementById('clear').hidden=!Object.keys(FOUND).length;}
  document.addEventListener('change',function(e){
    if(!e.target.matches('td.chk input'))return;
    var tr=e.target.closest('tr'), it=ITEMS[+tr.getAttribute('data-i')]; if(!it)return;
    if(e.target.checked)FOUND[idOf(it)]=1; else delete FOUND[idOf(it)];
    tr.classList.toggle('found',e.target.checked); saveFound(); updateClear();
  });
  document.addEventListener('click',function(e){
    if(e.target.closest('a')||e.target.closest('td.chk'))return;
    var tr=e.target.closest('table.books tr.p'); if(tr)toggle(tr);
  });
  function listText(){
    var lines=OPEN.map(function(i){return i.title+' — '+(i.who||'')+(i.kind&&i.kind!=='Book'?' ('+i.kind.toLowerCase()+')':'')+', due '+(i.due?fmt(i.due):'?')+(i.status==='Overdue'?' OVERDUE':'');});
    return 'Library returns\n'+lines.join('\n');
  }
  function flash(b,msg){var t=b.textContent;b.textContent=msg;setTimeout(function(){b.textContent=t;},1800);}
  function copy(txt){
    if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(txt);
    var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();return Promise.resolve();
  }
  document.getElementById('share').addEventListener('click',function(){
    var b=this, txt=listText();
    if(navigator.share){navigator.share({text:txt}).catch(function(err){if(err&&err.name!=='AbortError')copy(txt).then(function(){flash(b,'Copied');});});}
    else copy(txt).then(function(){flash(b,'Copied — paste into Notes');},function(){flash(b,'Couldn’t copy');});
  });
  document.getElementById('clear').addEventListener('click',function(){
    FOUND={};saveFound();document.querySelectorAll('td.chk input').forEach(function(c){c.checked=false;c.closest('tr').classList.remove('found');});updateClear();
  });
  fetch('library.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    document.getElementById('updated').textContent=d.updated?'Updated '+parse(d.updated).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
    var items=d.items||[];
    var open=items.filter(function(i){return i.status!=='Returned';}).sort(function(a,b){
      return (a.due||'9').localeCompare(b.due||'9')||(PEOPLE.indexOf(a.who)-PEOPLE.indexOf(b.who))||(a.kind||'').localeCompare(b.kind||'')||a.title.localeCompare(b.title);});
    var nLate=open.filter(function(i){return i.status==='Overdue';}).length;
    var per=PEOPLE.map(function(p){var n=open.filter(function(i){return i.who===p;}).length;return n?p+' '+n:'';}).filter(String).join(', ');
    document.getElementById('summary').textContent=open.length?open.length+' out'+(per?' ('+per+')':'')+(nLate?' \u00b7 '+nLate+' overdue':''):'Nothing checked out.';
    OPEN=open;
    var ids={}; open.forEach(function(i){ids[idOf(i)]=1;}); for(var k in FOUND){if(!ids[k])delete FOUND[k];} saveFound();
    document.getElementById('out').innerHTML=open.length?HEAD_OUT+open.map(function(i,k){return row(i,false,k>0&&i.due!==open[k-1].due);}).join(''):'<tr><td class="empty">Nothing checked out.</td></tr>';
    updateClear();
    var past=items.filter(function(i){return i.status==='Returned';}).sort(function(a,b){return (b.returned||'').localeCompare(a.returned||'');}).slice(0,15);
    if(past.length){document.getElementById('past').innerHTML=HEAD.replace('Due','Returned')+past.map(function(i){return row(i,true,false);}).join('');document.getElementById('past-wrap').hidden=false;}
  }).catch(function(){document.getElementById('out').innerHTML='<tr><td class="empty">Couldn’t load the list.</td></tr>';});
})();
</script>
</body></html>
