<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library</title><link rel="stylesheet" href="../style.css">
<style>
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.top h1{margin-top:.4em}
.side{text-align:right;font-size:.85rem;flex:none}
.side a{font-weight:600}
table.hours{border-collapse:collapse;margin:6px 0 0 auto}
table.hours td{padding:1px 0 1px 10px;text-align:left;color:var(--muted)}
table.hours td:first-child{padding-left:0}
table.hours tr.today td{color:var(--fg);font-weight:700}
table.hours tr.today td:first-child::before{content:"\25B8 ";color:var(--accent)}
.summary{font-size:1.05rem;font-weight:600;margin:.4em 0 0}
h2 .count{color:var(--muted);font-weight:400;font-size:1rem}
table.books{width:100%;border-collapse:collapse;font-size:1rem}
@media (max-width:480px){table.books{font-size:.92rem}table.books td{padding:7px 4px}}
table.books th{text-align:left;font-size:.8rem;font-weight:600;color:var(--muted);padding:6px;border-bottom:2px solid var(--line)}
table.books td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.books th:first-child{padding-left:10px}
table.books th:last-child,table.books td:last-child{padding-right:8px}
table.books td.due,table.books td.kind,table.books td.who{white-space:nowrap;width:1%}
table.books td.due,table.books td.kind{color:var(--muted)}
table.books td.due.late{color:#c0392b;font-weight:700}
table.books tr.newdate td{border-top:2px solid var(--line)}
:root{--p-gerald:#2f6db5;--p-alice:#8a4fbf;--p-june:#2e8b57;--p-other:#777}
@media (prefers-color-scheme:dark){:root{--p-gerald:#6fa8ef;--p-alice:#c49cf0;--p-june:#6fcf97}}
table.books tr.p td:first-child{box-shadow:inset 4px 0 0 var(--pc);padding-left:10px}
table.books tr.p td{background:color-mix(in srgb,var(--pc) 7%,transparent)}
table.books td.who b{color:var(--pc);font-weight:700}
.empty{color:var(--muted)}
details table.books{margin-top:6px}
</style></head>
<body><header class="site"><a href="../index.html">Home</a><a href="../recipes/index.html">Recipes</a><a href="../habits/index.html">Habits</a><a href="../projects/index.html">Projects</a></header>
<main>
<div class="top">
  <div><h1>Library</h1><p class="meta" id="updated"></p></div>
  <div class="side">
    <a href="https://sierramadre.biblionix.com/">Library account</a>
    <table class="hours" id="hours">
      <tr data-d="1"><td>Mon</td><td>11–8</td></tr>
      <tr data-d="2"><td>Tue</td><td>11–8</td></tr>
      <tr data-d="3"><td>Wed</td><td>11–8</td></tr>
      <tr data-d="4"><td>Thu</td><td>10–6</td></tr>
      <tr data-d="5"><td>Fri</td><td>Closed</td></tr>
      <tr data-d="6"><td>Sat</td><td>10–6</td></tr>
      <tr data-d="0"><td>Sun</td><td>Closed</td></tr>
    </table>
  </div>
</div>
<p class="summary" id="summary"></p>

<table class="books" id="out"><tr><td class="empty">Loading…</td></tr></table>

<details id="past-wrap" hidden><summary>Recently returned</summary><table class="books" id="past"></table></details>
</main>
<script>
(function(){
  var PEOPLE=['Gerald','Alice','June'];
  var dow=new Date().getDay();
  var tr=document.querySelector('#hours tr[data-d="'+dow+'"]'); if(tr)tr.className='today';
  function parse(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2]);}
  function fmt(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate();}
  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
  var HEAD='<tr><th>Due</th><th>Title</th><th>Type</th><th>Who</th></tr>';
  function row(it,past,brk){
    var date=past?(it.returned?fmt(it.returned):''):(it.due?fmt(it.due):'');
    var late=!past&&it.status==='Overdue';
    var pc='--pc:var(--p-'+(['Gerald','Alice','June'].indexOf(it.who)>=0?it.who.toLowerCase():'other')+')';
    return '<tr class="p'+(brk?' newdate':'')+'" style="'+pc+'"><td class="due'+(late?' late':'')+'">'+date+'</td><td>'+esc(it.title)+'</td><td class="kind">'+esc(it.kind||'Book')+'</td><td class="who"><b>'+esc(it.who||'')+'</b></td></tr>';
  }
  fetch('library.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    document.getElementById('updated').textContent=d.updated?'Updated '+parse(d.updated).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
    var items=d.items||[];
    var open=items.filter(function(i){return i.status!=='Returned';}).sort(function(a,b){
      return (a.due||'9').localeCompare(b.due||'9')||(PEOPLE.indexOf(a.who)-PEOPLE.indexOf(b.who))||(a.kind||'').localeCompare(b.kind||'')||a.title.localeCompare(b.title);});
    var nLate=open.filter(function(i){return i.status==='Overdue';}).length;
    var per=PEOPLE.map(function(p){var n=open.filter(function(i){return i.who===p;}).length;return n?p+' '+n:'';}).filter(String).join(', ');
    document.getElementById('summary').textContent=open.length?open.length+' out'+(per?' ('+per+')':'')+(nLate?' \u00b7 '+nLate+' overdue':''):'Nothing checked out.';
    document.getElementById('out').innerHTML=open.length?HEAD+open.map(function(i,k){return row(i,false,k>0&&i.due!==open[k-1].due);}).join(''):'<tr><td class="empty">Nothing checked out.</td></tr>';
    var past=items.filter(function(i){return i.status==='Returned';}).sort(function(a,b){return (b.returned||'').localeCompare(a.returned||'');}).slice(0,15);
    if(past.length){document.getElementById('past').innerHTML=HEAD.replace('Due','Returned')+past.map(function(i){return row(i,true,false);}).join('');document.getElementById('past-wrap').hidden=false;}
  }).catch(function(){document.getElementById('out').innerHTML='<tr><td class="empty">Couldn’t load the list.</td></tr>';});
})();
</script>
</body></html>
